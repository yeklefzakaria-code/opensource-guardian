name: Dependency Security Audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: Audit Python dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit pip-tools
      - name: Audit declared dependencies against the Python Advisory Database
        run: pip-compile --quiet --output-file /tmp/requirements-audit.lock requirements-audit.txt
          pip-audit --requirement /tmp/requirements-audit.lock --format json --output pip-audit-report.json
      - name: Upload machine-readable audit report
        if: always() && hashFiles('pip-audit-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-report
          path: pip-audit-report.json
          if-no-files-found: ignore
          retention-days: 14
